<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slovenia &amp; Neighbours Sole-Proprietor Tax Suite 2026</title>
  <meta name="theme-color" id="meta-theme-color" content="#f5f6f8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Normiranec">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg?v=2026">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png?v=2026">
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/icon-192.png?v=2026">
  <link rel="shortcut icon" href="./favicon.ico?v=2026">
  <link rel="apple-touch-icon" sizes="180x180" href="./assets/apple-touch-icon.png?v=2026">
  <link rel="manifest" href="./manifest.webmanifest?v=2026">
  <script>
    (function () {
      var m = location.hash.match(/(?:^|[&#])theme=(dark|light)/);
      var t = m ? m[1] : null;
      try { if (!t) t = localStorage.getItem('si_tax_calc_theme'); } catch (e) {}
      if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      var tc = document.getElementById('meta-theme-color');
      if (tc) tc.setAttribute('content', t === 'dark' ? '#0a0c10' : '#f5f6f8');
    })();
  </script>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

<div class="app-shell" id="app-container">
  <!-- Minimal Top Header -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-title-row">
        <h1 id="brand-title">Normiranec</h1>
        <span class="year-badge">2026</span>
      </div>
      <p class="brand-sub" id="brand-subtitle">Slovenia &amp; Central Europe — Sole-Proprietor Tax Suite 2026</p>
    </div>

    <div class="controls">
      <button type="button" class="btn-utility" id="btn-share" title="Share Scenario">Share</button>
      <button type="button" class="btn-utility btn-lang" id="btn-lang" title="Switch Language">SL</button>
      <button type="button" class="btn-utility btn-theme" id="btn-theme" title="Toggle Dark/Light Theme" aria-label="Toggle Theme"></button>
    </div>
  </header>

  <!-- Primary Country & Cross-Border Arena Navigation -->
  <nav class="country-nav" aria-label="Countries and Comparison">
    <div class="country-tabs-group">
      <button type="button" class="nav-tab active" data-nav-tab="si"><span class="nav-flag" data-flag="si"></span><span class="nav-lbl">Slovenija</span></button>
      <button type="button" class="nav-tab" data-nav-tab="hr"><span class="nav-flag" data-flag="hr"></span><span class="nav-lbl">Hrvaška</span></button>
      <button type="button" class="nav-tab" data-nav-tab="it"><span class="nav-flag" data-flag="it"></span><span class="nav-lbl">Italija</span></button>
      <button type="button" class="nav-tab" data-nav-tab="at"><span class="nav-flag" data-flag="at"></span><span class="nav-lbl">Avstrija</span></button>
      <button type="button" class="nav-tab" data-nav-tab="hu"><span class="nav-flag" data-flag="hu"></span><span class="nav-lbl">Madžarska</span></button>
    </div>
    <button type="button" class="nav-tab arena-tab" data-nav-tab="compare"><span class="nav-lbl">Primerjaj vse</span></button>
  </nav>

  <!-- Unified Revenue Command Strip -->
  <section class="revenue-strip">
    <div class="revenue-main">
      <div class="rev-input-col">
        <div class="label-row">
          <span class="rev-label-wrap">
            <span class="overline" id="lbl-global-rev">Letni prihodki (€)</span>
            <span class="equiv-pill num-tabular" id="rev-period-equiv"></span>
          </span>
          <button type="button" class="info-trigger" data-tip-key="desc_revenue" aria-label="Info">?</button>
        </div>

        <div class="hero-input-wrapper">
          <span class="currency-prefix" aria-hidden="true">€</span>
          <input type="number" id="global-revenue" class="hero-revenue-input num-tabular" value="65000" min="0" step="any" data-step="5000">
          <div class="spinner-group">
            <button type="button" class="spin-btn" data-step-target="global-revenue" data-step-dir="-1" aria-label="Decrease">−</button>
            <button type="button" class="spin-btn" data-step-target="global-revenue" data-step-dir="1" aria-label="Increase">+</button>
          </div>
        </div>
      </div>

      <div class="rev-actions-col">
        <div class="view-toggle" role="group" aria-label="Billing Period">
          <button type="button" class="view-btn" data-view-mode="monthly" id="view-mo">Mesečno</button>
          <button type="button" class="view-btn active" data-view-mode="yearly" id="view-yr">Letno</button>
        </div>
        <div class="quick-rev-row" id="quick-rev-row"></div>
      </div>
    </div>
  </section>

  <!-- Dynamic Workspace Mount -->
  <main id="view-mount"></main>

  <!-- Legal Disclaimer Footer -->
  <footer class="footer-disclaimer" id="footer-disclaimer"></footer>
</div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
